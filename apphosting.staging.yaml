# Firebase App Hosting — staging backend (GCP project: tratto-staging)
# The backend tracks the `main` branch, same as production.
#
# NOT APPLIED TODAY: App Hosting reads this file only when the backend's
# environment name is `staging`. The tratto-staging backend has none set
# (checked 2026-09-14), so staging builds with apphosting.yaml (production
# values) and serves on tratto-docs--tratto-staging.europe-west4.hosted.app.
# docs.staging.tratto.email is not mapped and has no DNS record.
#
# NEXT_PUBLIC_SITE_URL is what makes the app serve `Disallow: /` in robots.txt
# and add `X-Robots-Tag: noindex` — staging must never be indexed.
runConfig:
  runCommand: pnpm start
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2
  concurrency: 80

env:
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://docs.staging.tratto.email
    availability:
      - BUILD
      - RUNTIME

  - variable: TRATTO_OPENAPI_URL
    value: https://api-staging.tratto.email/docs/json
    availability:
      - BUILD
